<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vital Drop | Register</title>
    <link rel="stylesheet" href="/CSS/form.css">
    <link rel="icon" type="image/x-icon" href="/images/vital-drop/Drop.png">
</head>

<body>
    <main>

        <div id="container" class="register-container">
            <img src="/images/icons/backBtn.png" alt="Back Button" id="backArrow">
            
            <div id="left">
                <img src="/images/vital-drop/VitalDrop.png" alt="Vital Drop Text" draggable="false">
            </div>

            <div id="right">
                <form action="home.html" id="register-form">
                    <div id="inputs">
                        <input type="text" name="name" id="name" class="input" placeholder="Name"><br><br>
                        <input type="text" name="lastname" id="lastname" class="input" placeholder="Lastname"><br><br>
                        <input type="text" name="email" id="email" class="input" placeholder="Email"><br><br>
                        <input type="password" name="password" id="password" class="input" placeholder="Password"><br><br>
                        <input type="submit" value="Register" id="formBtn"><br>
                        <a href="login.html" id="hasAccount">Already have an account?</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="/JS/forms.js"></script>

</body>

</html>
