<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vital Drop | Log in</title>
    <link rel="stylesheet" href="/CSS/form.css">
    <link rel="icon" type="image/x-icon" href="/images/Drop.png">
</head>

<body>
    <main>
        <div id="container">
            <div class="left">
                <img src="/images/Drop.png" alt="Drop Logo" draggable="false">
                <img src="/images/VitalDrop.png" alt="Vital Drop Text" draggable="false">
            </div>

            <div class="right">
                <form action="home.html">
                    <div id="inputs">
                        <input type="text" name="email" id="name" class="input" placeholder="Email"><br><br>
                        <input type="password" name="password" id="password" class="input" placeholder="Password"><br><br>
                        <input type="submit" value="Log In" id="formBtn"><br>
                        <a href="register.html" id="hasAccount">Don't have an account?</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
